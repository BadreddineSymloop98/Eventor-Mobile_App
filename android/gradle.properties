org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler stores source paths relative to the module
# root. This project lives on D: while the pub cache lives on C:, and Windows
# has no relative path between two drives — so every cache write throws and
# plugin compilation fails. Turning incremental compilation off avoids the
# relative-path conversion entirely.
# Alternative fix: put PUB_CACHE on the same drive as the project.
kotlin.incremental=false
